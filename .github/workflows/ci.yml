name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: development
      DB_NAME: findash_ci
      DB_USER: findash
      DB_HOST: 127.0.0.1
      API_KEY: ""
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_DB: findash_ci
          POSTGRES_USER: findash
          # This disposable database is scoped to a GitHub-hosted CI runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U findash -d findash_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        run: uv sync --locked

      - name: Configure temporary PostgreSQL connection
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: printf 'DB_PORT=%s\n' "$POSTGRES_PORT" >> "$GITHUB_ENV"

      - name: Run Django system checks
        run: uv run --locked python manage.py check --fail-level WARNING

      - name: Check for missing migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run

      - name: Apply migrations to temporary PostgreSQL
        run: uv run --locked python manage.py migrate --noinput

      - name: Run backend tests
        run: uv run --locked python manage.py test --noinput

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        id: install
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build frontend for production
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
