x-backend: &backend
  build:
    context: ./backend
    target: development
  environment:
    DJANGO_ENV: development
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your Compose environment file}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1],backend
    DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    DB_NAME: ${POSTGRES_DB:-findash}
    DB_USER: ${POSTGRES_USER:-findash}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your Compose environment file}
    DB_HOST: postgres
    DB_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    DJANGO_THROTTLE_CACHE_URL: redis://redis:6379/1
    API_KEY: ${API_KEY:-}
    GROCERY_CATALOG_RETAILERS: ${GROCERY_CATALOG_RETAILERS:-}
    NOTIFICATION_MARKET_CHECKS_ENABLED: ${NOTIFICATION_MARKET_CHECKS_ENABLED:-false}
    NOTIFICATION_RENEWAL_INTERVAL_SECONDS: ${NOTIFICATION_RENEWAL_INTERVAL_SECONDS:-3600}
    NOTIFICATION_BUDGET_INTERVAL_SECONDS: ${NOTIFICATION_BUDGET_INTERVAL_SECONDS:-900}
    NOTIFICATION_MARKET_INTERVAL_SECONDS: ${NOTIFICATION_MARKET_INTERVAL_SECONDS:-900}
    NOTIFICATION_GROCERY_INTERVAL_SECONDS: ${NOTIFICATION_GROCERY_INTERVAL_SECONDS:-900}
    NOTIFICATION_RETENTION_INTERVAL_SECONDS: ${NOTIFICATION_RETENTION_INTERVAL_SECONDS:-86400}
    NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
    WARRANTY_PROOF_RETENTION_DAYS: ${WARRANTY_PROOF_RETENTION_DAYS:-365}
    WARRANTY_RECORD_RETENTION_DAYS: ${WARRANTY_RECORD_RETENTION_DAYS:-0}
  volumes:
    - ./backend/api:/app/api:ro
    - ./backend/backend:/app/backend:ro

services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findash}
      POSTGRES_USER: ${POSTGRES_USER:-findash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your Compose environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz/', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  worker:
    <<: *backend
    command: ["celery", "-A", "backend", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'celery -A backend inspect ping -d "celery@$$HOSTNAME" --timeout=5']
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3

  beat:
    <<: *backend
    command: ["celery", "-A", "backend", "beat", "--loglevel=INFO", "--schedule=/var/lib/findash/beat/celerybeat-schedule"]
    volumes:
      - ./backend/api:/app/api:ro
      - ./backend/backend:/app/backend:ro
      - celery_beat:/var/lib/findash/beat
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; assert redis.Redis.from_url(os.environ['CELERY_BROKER_URL'], socket_timeout=3).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  postgres_data:
  redis_data:
  celery_beat:
